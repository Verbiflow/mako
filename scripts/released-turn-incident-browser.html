<!doctype html>
<html class="dark" lang="en">
<meta charset="utf-8" />
<title>Released turn rendering checks</title>
<body>
<script type="module">
// Mako desk previews inject a read-only bridge in their top frame. The
// standalone synthetic source belongs in a child, with no profile connection.
if (window === window.top) {
  const frame = document.createElement("iframe")
  frame.id = "isolated-history"
  frame.style.cssText = "position:fixed;inset:0;width:100%;height:100%;border:0"
  frame.src = location.pathname + "?isolated=1"
  document.body.append(frame)
} else {
  window.fixtureTimeAdvance = 0
  const actualNow = Date.now
  Date.now = () => actualNow() + window.fixtureTimeAdvance
  await import("/src/dev/released-turn-incident-check.tsx")
}
</script>
</body>
</html>
