disabled_mcp_servers = ["todoist"]

[cli]
auto_update = false

[ui]
theme = "dark"
permission_mode = "default"

[compat.cursor]
hooks = false

[mcp_servers.wisprflow]
url = "https://mcp.wispr.example/mcp"
