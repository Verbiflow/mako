<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Element pick fixture</title>
    <style>
      body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, sans-serif; background: #f6f4f1; color: #24211e; }
      main { max-width: 760px; margin: 48px auto; padding: 0 24px; }
      .plans { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
      .card { padding: 20px; border-radius: 12px; background: white; box-shadow: 0 1px 2px #0001, 0 0 0 1px #0000000d; }
      .card h2 { margin: 0 0 4px; font-size: 18px; }
      .price { font-size: 28px; font-weight: 650; margin: 8px 0 16px; }
      .cta { padding: 8px 14px; border: 0; border-radius: 8px; background: #24211e; color: white; font: inherit; font-weight: 550; }
      .cta.secondary { background: #e9e5df; color: #24211e; }
      #clicks { margin-top: 24px; color: #6b655e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
