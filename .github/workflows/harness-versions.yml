name: Harness versions

# The daily bump. Each harness declares the newest version Mako's session
# flows passed on (`tested`, in packages/host/src/harnesses/<harness>/versions.ts),
# which Mako's installs and Update go to. This reads every vendor's newest
# release and, for each one newer than tested, opens a pull request that
# moves tested and reruns the drift tools: protocol types, native tools,
# self-report and the session flows, all against a scripted model, so a bump
# spends no usage and its diff shows what the release changed. Its checks
# say whether Mako still works on it; a red one stays out of Mako's Update.
#
# Locally, `npx tsx scripts/bump-harness-versions.ts --dry-run` prints what
# this would bump and changes nothing.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: harness-versions
  cancel-in-progress: false

jobs:
  find:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      due: ${{ steps.read.outputs.due }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      # The scripts read Mako's own packages (@mako/sessions, @mako/git, …) from
      # their built output, as the host does; a fresh checkout has none.
      - run: npm run build:control-runtime
      - name: Read every vendor's newest release
        id: read
        run: |
          npx tsx scripts/bump-harness-versions.ts --dry-run
          due=$(npx tsx scripts/bump-harness-versions.ts --json | node -e 'const rows = JSON.parse(require("fs").readFileSync(0, "utf8")); process.stdout.write(JSON.stringify(rows.filter((row) => row.bump).map((row) => ({ harness: row.provider, version: row.newest }))))')
          echo "due=$due" >> "$GITHUB_OUTPUT"

  bump:
    needs: find
    if: needs.find.outputs.due != '[]'
    # A fresh runner, so each harness installs through Mako's own install plan
    # at the version the bump declares, as a new machine would.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Reading only: the bot's own token pushes and opens the pull request.
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.find.outputs.due) }}
    env:
      BRANCH: harness-versions/${{ matrix.harness }}-${{ matrix.version }}
    steps:
      # The pull request is the bot's (Mako by Verbiflow): one the workflow's own token opened would run no checks,
      # and its checks are the news. People open theirs as themselves; only automations use the bot.
      - name: Act as the bot
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.MAKO_BOT_APP_ID }}
          private-key: ${{ secrets.MAKO_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          token: ${{ steps.bot.outputs.token }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Skip a release that already has its pull request
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state all --json number --jq '.[0].number')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.open.outputs.exists != 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build:control-runtime
        if: steps.open.outputs.exists != 'true'
      - name: Move tested and rerun the drift tools
        id: bump
        if: steps.open.outputs.exists != 'true'
        # A failing step is the pull request's news, not the job's end.
        continue-on-error: true
        run: npx tsx scripts/bump-harness-versions.ts "${{ matrix.harness }}" --write --summary "$RUNNER_TEMP/summary.md"
      - name: Open the pull request
        if: steps.open.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          OUTCOME: ${{ steps.bump.outcome }}
          BOT: ${{ steps.bot.outputs.app-slug }}
        run: |
          git config user.name "$BOT[bot]"
          git config user.email "$(gh api "/users/$BOT%5Bbot%5D" --jq .id)+$BOT[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A packages scripts package.json package-lock.json
          git commit -m "Move ${{ matrix.harness }} to ${{ matrix.version }}"
          # The branch is this job's alone. One left by a run that couldn't open its
          # pull request (none exists, or the step above would have skipped) is replaced.
          git push --force origin "$BRANCH"
          title="Move ${{ matrix.harness }} to ${{ matrix.version }}"
          if [ "$OUTCOME" != "success" ]; then title="$title (drift found)"; fi
          gh pr create --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/summary.md"

  macos:
    needs: [find, bump]
    if: needs.find.outputs.due != '[]'
    # The same release's session flows on macOS, reported on its pull request.
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.find.outputs.due) }}
    env:
      BRANCH: harness-versions/${{ matrix.harness }}-${{ matrix.version }}
    steps:
      - name: Skip a pull request macOS already reported on
        id: reported
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$(gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json comments --jq '[.comments[].body | startswith("Session flows on macOS")] | any' 2>/dev/null)" = true ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: steps.reported.outputs.done != 'true'
        with:
          ref: ${{ env.BRANCH }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        if: steps.reported.outputs.done != 'true'
        with:
          node-version: 24
          package-manager-cache: false
      # The branch carries the release, so installing or building it can be the first thing it breaks (a patch that
      # targets the old version, types its protocol changed): that's said on the pull request like a failed flow.
      - name: Install
        id: install
        if: steps.reported.outputs.done != 'true'
        continue-on-error: true
        run: npm ci
      - name: Build
        id: build
        if: steps.reported.outputs.done != 'true' && steps.install.outcome == 'success'
        continue-on-error: true
        run: npm run build:control-runtime
      - name: Install tested and run the session flows
        id: flows
        if: steps.reported.outputs.done != 'true' && steps.build.outcome == 'success'
        continue-on-error: true
        run: npx tsx scripts/bump-harness-versions.ts "${{ matrix.harness }}" --verify --summary "$RUNNER_TEMP/macos.md"
      - name: Report on the pull request
        if: steps.reported.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALL: ${{ steps.install.outcome }}
          BUILD: ${{ steps.build.outcome }}
          OUTCOME: ${{ steps.flows.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$INSTALL" != "success" ]; then outcome="not run: npm ci failed on this branch"
          elif [ "$BUILD" != "success" ]; then outcome="not run: the build failed on this branch"
          else outcome="$OUTCOME"; fi
          { echo "Session flows on macOS: $outcome"; echo; cat "$RUNNER_TEMP/macos.md" 2>/dev/null; echo; echo "[The run]($RUN)"; } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$BRANCH" --body-file "$RUNNER_TEMP/comment.md"
