name: Main watch

# CI on main is the whole of it (`ci` in checks.yml): the heavy jobs a pull request skips unless its paths reach them
# run there after every merge. When it fails, this names the commit, each failed job's suites and their logs in a
# `main-red` issue, and makes the revert ready on `revert/<sha>` (`scripts/ci-main-watch.mjs`): fixed or reverted
# within the hour, never left standing.

on:
  workflow_run:
    workflows: [Lint and typecheck]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: main-watch-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  watch:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 200
      - run: node scripts/ci-main-watch.mjs ${{ github.event.workflow_run.id }}
        env:
          GH_TOKEN: ${{ github.token }}
          # The revert commit's author and committer: whoever's push turned main red, by GitHub's no-reply address.
          GIT_AUTHOR_NAME: ${{ github.event.workflow_run.actor.login }}
          GIT_AUTHOR_EMAIL: ${{ github.event.workflow_run.actor.id }}+${{ github.event.workflow_run.actor.login }}@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ github.event.workflow_run.actor.login }}
          GIT_COMMITTER_EMAIL: ${{ github.event.workflow_run.actor.id }}+${{ github.event.workflow_run.actor.login }}@users.noreply.github.com
