name: Windows computer control

# The shared native driver (vendor/cua-driver: upstream Cua's Rust driver plus Mako's reviewed patch) built for Windows
# x64 with MSVC and a static CRT, then driven on a hosted Windows runner: the driver's own protocol against a fixture
# window, Notepad and Calculator, with latencies and idle cost, and Mako's control runtime over the same daemon.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-control.yml
      - .github/actions/install-dependencies/**
      - vendor/cua-driver/**
      - packages/control/**
      - packages/control-runtime/**
      - packages/host/src/control/**
      - scripts/package-control-driver-windows.mjs
      - scripts/test-control-driver-windows.ts
      - scripts/fixtures/win-control-fixture.ps1
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: windows-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  driver:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - name: Reconstruct the reviewed native source
        shell: bash
        run: |
          native="$RUNNER_TEMP/cua"
          git init -q "$native"
          git -C "$native" remote add origin https://github.com/trycua/cua.git
          base=$(node -p 'require("./vendor/cua-driver/release.json").base')
          git -C "$native" fetch -q --depth=1 origin "$base"
          git -C "$native" checkout -q --detach FETCH_HEAD
          git -C "$native" apply "$GITHUB_WORKSPACE/vendor/cua-driver/release.patch"
          git -C "$native" add -N libs/cua-driver/rust libs/cua-driver/wayland-helper
          echo "MAKO_NATIVE_CHECKOUT=$native" >> "$GITHUB_ENV"
      # Kept as soon as the build ends, so a failing check later doesn't cost the next run its build.
      - id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cua-target
          key: cua-driver-windows-x64-${{ hashFiles('vendor/cua-driver/release.json', 'vendor/cua-driver/release.patch') }}
          restore-keys: cua-driver-windows-x64-
      - name: Build and audit the driver package
        shell: bash
        run: |
          node scripts/package-control-driver-windows.mjs "$MAKO_NATIVE_CHECKOUT" --target-dir="$RUNNER_TEMP/cua-target"
          version=$(node -p 'require("./vendor/cua-driver/release.json").version')
          package="$GITHUB_WORKSPACE/release/control-driver/$version/windows-x64"
          echo "MAKO_DRIVER_PACKAGE=$package" >> "$GITHUB_ENV"
          mkdir -p evidence
          cp "$package/provenance.json" evidence/
          ls -l "$package"
      - if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ runner.temp }}/cua-target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - uses: ./.github/actions/install-dependencies
        with:
          electron: "false"
      - name: Build the control runtime
        shell: bash
        run: npm run build:control-runtime
      - name: The driver and the control runtime against a fixture, Notepad and Calculator
        shell: bash
        run: npx tsx scripts/test-control-driver-windows.ts --driver "$MAKO_DRIVER_PACKAGE/cua-driver.exe" --json evidence/windows-control.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-control
          path: |
            evidence
            release/control-driver
          if-no-files-found: ignore
