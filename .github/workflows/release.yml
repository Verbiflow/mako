name: Apple silicon release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'test' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck:all
      - run: npm test --workspace @mako/sessions
      - run: npm run backend:test

      - name: Configure signing and notarization
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          values=(
            "$CSC_LINK"
            "$CSC_KEY_PASSWORD"
            "$APPLE_API_KEY_P8"
            "$APPLE_API_KEY_ID"
            "$APPLE_API_ISSUER"
          )
          present=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && ((present += 1))
          done
          if (( present > 0 && present < ${#values[@]} )); then
            printf 'Signing is only enabled when every release credential is configured.\n' >&2
            exit 1
          fi
          if (( present == ${#values[@]} )); then
            api_key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$api_key"
            chmod 600 "$api_key"
            printf 'CSC_LINK=%s\n' "$CSC_LINK" >> "$GITHUB_ENV"
            printf 'CSC_KEY_PASSWORD=%s\n' "$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_API_KEY=%s\n' "$api_key" >> "$GITHUB_ENV"
            printf 'APPLE_API_KEY_ID=%s\n' "$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
            printf 'APPLE_API_ISSUER=%s\n' "$APPLE_API_ISSUER" >> "$GITHUB_ENV"
            echo 'MAKO_NOTARIZED=1' >> "$GITHUB_ENV"
          else
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
            echo 'MAKO_NOTARIZED=0' >> "$GITHUB_ENV"
          fi

      - name: Build Apple silicon app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi
          if [[ "$MAKO_NOTARIZED" == "1" ]]; then
            npm pkg set build.extraMetadata.makoDistribution=signed
            npm pkg delete build.mac.identity
          fi
          npm run package:mac

      - name: Verify macOS package
        run: |
          if [[ "$MAKO_NOTARIZED" == "1" ]]; then
            npm run verify:mac-release -- --notarized
          else
            npm run verify:mac-release
          fi

      - name: Write checksums
        run: |
          cp scripts/install-macos.sh release/install-macos.sh
          cd release
          shasum -a 256 Mako-arm64.dmg Mako-arm64.zip install-macos.sh > SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes="$RUNNER_TEMP/release-notes.md"
            if [[ "$MAKO_NOTARIZED" == "1" ]]; then
              printf '%s\n\n' \
                'This release is signed with Developer ID and notarized by Apple.' \
                > "$notes"
            else
              cat > "$notes" <<'NOTICE'
          > [!IMPORTANT]
          > This build is **not signed or notarized by Apple**. macOS will block a
          > normal first launch. The installer below verifies the published SHA-256
          > checksum before copying Mako to Applications and removes quarantine only
          > from that copied app. Install it only if you trust this repository.

          ```bash
          curl -fsSL https://github.com/Verbiflow/mako/releases/latest/download/install-macos.sh | bash
          ```

          To inspect the installer before running it, download `install-macos.sh`
          from this release and read it locally.

          NOTICE
            fi
            gh api --method POST repos/Verbiflow/mako/releases/generate-notes \
              -f tag_name="$GITHUB_REF_NAME" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body >> "$notes"
            gh release create "$GITHUB_REF_NAME" \
              release/Mako-arm64.dmg \
              release/Mako-arm64.zip \
              release/Mako-arm64.dmg.blockmap \
              release/Mako-arm64.zip.blockmap \
              release/latest-mac.yml \
              release/install-macos.sh \
              release/SHA256SUMS.txt \
              --verify-tag \
              --notes-file "$notes" \
              --latest \
              --title "Mako ${GITHUB_REF_NAME#v}"
          else
            gh release upload "$GITHUB_REF_NAME" \
              release/Mako-arm64.dmg \
              release/Mako-arm64.zip \
              release/Mako-arm64.dmg.blockmap \
              release/Mako-arm64.zip.blockmap \
              release/latest-mac.yml \
              release/install-macos.sh \
              release/SHA256SUMS.txt \
              --clobber
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: Mako-macOS-arm64-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
            release/install-macos.sh
            release/SHA256SUMS.txt
          if-no-files-found: error
