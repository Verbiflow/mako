name: Windows release

# Mako for Windows x64: built and packaged as the per-user NSIS installer (scripts/package-windows.mjs), installed on the
# runner, launched, measured and uninstalled (scripts/smoke-windows-install.mjs). A version tag publishes the installer,
# its blockmap and latest.yml to the release the Apple silicon job makes, the feed electron-updater reads on Windows as
# it reads latest-mac.yml on a Mac.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/windows-release.yml
      - .github/actions/install-dependencies/**
      - build/installer.nsh
      - electron/**
      - packages/host/src/base/host-environment.ts
      - packages/host/src/transport/service.ts
      - packages/host/src/conversations/keep-awake.ts
      - packages/host/src/contracts/local-folder.ts
      - packages/host/src/workspaces/session-methods.ts
      - scripts/package-windows.mjs
      - scripts/smoke-windows-install.mjs
      - scripts/audit-package.mjs
      - scripts/test-packaged-imports.mjs
      - scripts/build-video-helper.mjs
      - scripts/bundle-main.mjs
      - native/video-windows/**
      - native/windows-helper/**
      - scripts/build-windows-helper.mjs
      - package.json
      - package-lock.json

# Read-only by default; only `publish`, on a version tag, may write to the release.
permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || 'test' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false

      - uses: ./.github/actions/install-dependencies

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi
          npm run build

      - name: Deep links
        run: npm run test:desktop-deep-link

      # Authenticode on a version tag, from the `release` environment's credentials (see scripts/package-windows.mjs);
      # every other run is unsigned and never sees them. Unsigned installs and runs but turns the updater off, as an
      # unsigned Mac build does.
      - name: Package the installer
        env:
          MAKO_CLOUD_URL: ${{ vars.MAKO_CLOUD_URL }}
          MAKO_WINDOWS_PUBLISHER: ${{ startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_PUBLISHER_NAME || '' }}
          AZURE_TENANT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_AZURE_CLIENT_SECRET || '' }}
          MAKO_AZURE_SIGNING_ENDPOINT: ${{ startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_TRUSTED_SIGNING_ENDPOINT || '' }}
          MAKO_AZURE_SIGNING_ACCOUNT: ${{ startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_TRUSTED_SIGNING_ACCOUNT || '' }}
          MAKO_AZURE_SIGNING_PROFILE: ${{ startsWith(github.ref, 'refs/tags/v') && vars.WINDOWS_TRUSTED_SIGNING_PROFILE || '' }}
          WIN_CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERT_P12 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERT_PASSWORD || '' }}
        run: |
          npm run -s test:renderer-assets
          node scripts/package-windows.mjs
          cat release/package-inputs.json

      # What needs the host is reported until the Windows host lands (scratch/windows-host); then this adds
      # --require-host, and the window, the host's /health, the hand-over and the close are required too.
      - name: Install, launch, measure and uninstall
        run: node scripts/smoke-windows-install.mjs release/Mako-Setup-x64.exe --evidence smoke-evidence

      - name: Write checksums
        run: |
          cd release
          sha256sum Mako-Setup-x64.exe > SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Mako-Windows-x64-${{ github.run_id }}
          path: |
            release/Mako-Setup-x64.exe
            release/Mako-Setup-x64.exe.blockmap
            release/latest.yml
            release/package-inputs.json
            release/package-size.json
            release/SHA256SUMS-windows.txt
            smoke-evidence/
          if-no-files-found: warn
          retention-days: 14

  # A version tag's installer: attested to this workflow and commit, then added to the release the Apple silicon job
  # makes. The only job that can write.
  publish:
    needs: windows-x64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Mako-Windows-x64-${{ github.run_id }}
          path: .

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release/Mako-Setup-x64.exe

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The Apple silicon job creates the release and its notes; this adds Windows's files once it exists.
        run: |
          for attempt in $(seq 1 90); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
                release/Mako-Setup-x64.exe \
                release/Mako-Setup-x64.exe.blockmap \
                release/latest.yml \
                release/SHA256SUMS-windows.txt
              exit 0
            fi
            sleep 60
          done
          echo "The release $GITHUB_REF_NAME never appeared" >&2
          exit 1
