name: Windows browser control

# Browser control on a hosted Windows runner, which has Chrome and Edge installed: discovery from App Paths and the
# install folders, the extension's native host through HKCU's NativeMessagingHosts keys, page control over native
# messaging, the machine browser attached over CDP, and a tab's H.264 live video encoded by the capture extension
# (WebCodecs) in Chrome and in Edge.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/actions/install-dependencies/**
      - .github/workflows/windows-browser.yml
      - browser-extension/**
      - electron/browser-application.ts
      - electron/browser-native-host*.ts
      - packages/control-runtime/src/browser-*.ts
      - packages/control-runtime/src/machine-*.ts
      - packages/control-runtime/src/processes.ts
      - packages/host/src/base/chromium-profiles.ts
      - packages/host/src/control/browser-extension-*.ts
      - packages/host/src/control/index.ts
      - packages/host/src/control/machine-video.ts
      - src/live-video/machine-capture.ts
      - scripts/build-machine-capture.mjs
      - scripts/test-browser-windows.mjs
      - scripts/test-machine-tab-video.mjs
      - package-lock.json

permissions:
  contents: read

concurrency:
  group: windows-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - uses: ./.github/actions/install-dependencies
      - name: Build the control runtime, the native host and the extension
        shell: bash
        run: |
          npm run build:control-runtime
          npx tsgo -b tsconfig.electron.json
          npm run build:browser-extension
      - name: Discovery, the extension's native host, page control, the machine browser
        shell: bash
        run: node scripts/test-browser-windows.mjs --json windows-browser.json
      - name: A tab's live video through the capture extension, in Chrome and in Edge
        if: always()
        shell: bash
        run: |
          failed=0
          for browser in "C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" "C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe"; do
            echo "== $browser"
            MAKO_TEST_BROWSER_EXECUTABLE="$browser" node scripts/test-machine-tab-video.mjs || failed=1
          done
          exit $failed
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-browser
          path: windows-browser.json
          if-no-files-found: ignore
