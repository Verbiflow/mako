name: Lint and typecheck

# Lint carries the host's boundaries: @mako/host imports nothing from
# Electron (scripts/check-host-electron.mjs), reads the platform only through
# its platform modules, adds no module-level state and keeps its start set.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # The protocol's conformance suite, every host call over the socket and the gateway, and the host as a cloud
  # machine's runtime, linked by a stand-in for the machine's agent.
  cloud-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build:control-runtime
      - run: npm run test:protocol
      - run: npm run test:machine-runtime
      - run: npx tsx scripts/test-cloud-sign-ins.ts

  # Every harness's decoders against its recorded pairs (live and saved draw the same, or say why not), and the
  # three readers of spend (live, saved, the store's scan) agreeing on each pair.
  decoders-and-usage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run build:control-runtime
      # The harness definitions, their versions and the pages generated from them (adding-a-harness.md, the descriptors).
      - run: npx tsx --tsconfig tsconfig.app.json scripts/test-harness-definitions.ts
      - run: npm run test:decoders
      - run: npm run test:usage
