name: Codex's sandbox on Linux
description: >-
  Let Codex's sandbox run on an Ubuntu 24.04 runner as on a Linux workstation. Codex sandboxes every command with
  bubblewrap, which the runner lacks, and Ubuntu 24.04 gives an unprivileged user namespace no capabilities, so Codex
  0.164.0's sandbox failed every shell call (`bwrap: loopback: Failed RTM_NEWADDR: Operation not permitted`).
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends bubblewrap
        sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
