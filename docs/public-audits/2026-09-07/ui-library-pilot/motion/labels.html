<!doctype html><meta charset="utf-8"><title>Mako label motion comparison</title>
<style>.slot-text {
  display: inline-flex;
  white-space: pre;
  align-items: baseline;
}

.char-slot {
  position: relative;
  display: inline-flex;
  /* Cells must never flex-shrink. When a cell's overflow stops being visible
     (e.g. .is-resizing), its automatic minimum size drops to 0, and a
     width-constrained line would crush those cells into overlapping slivers
     instead of letting the row overflow like it does at rest. */
  flex: none;
  justify-content: center;
  align-items: baseline;
  /* Clip only vertically: the roll needs a top/bottom mask, but glyph side
     bearings, kerning overhang and the settle tilt must stay visible so
     letters never look cropped. (overflow: hidden is the legacy fallback.) */
  overflow: hidden;
  overflow-x: visible;
  overflow-y: clip;
  line-height: 1.3;
}

/* Cells appearing from or collapsing to empty change width drastically, so
   clip them on both axes while they resize — otherwise their glyphs spill
   out of the shrinking cell and stack up over the neighbours. */
.char-slot.is-resizing {
  overflow-x: clip;
}

.char-sizer {
  visibility: hidden;
  white-space: pre;
}

.char-face {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: pre;
  will-change: transform;
}
</style>

<style>
:root{--surface:#181515;--text:#eee9e5;--border:#403a38;--ease-out:cubic-bezier(.22,1,.36,1);--ease-swift:cubic-bezier(.2,0,0,1)}
body{background:var(--surface);color:var(--text);font:13px system-ui;margin:48px;max-width:680px}button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);padding:12px;margin:8px;cursor:pointer}h1{font-size:15px}p{line-height:1.6}.whole{display:inline-grid;overflow:hidden;width:9em;vertical-align:middle}.whole span{grid-area:1/1;transition:transform 180ms var(--ease-out),opacity 180ms var(--ease-out)}.whole .yes{transform:translateY(100%);opacity:0}.whole[data-copied] .no{transform:translateY(-100%);opacity:0;transition-duration:120ms;transition-timing-function:var(--ease-swift)}.whole[data-copied] .yes{transform:translateY(0);opacity:1}.whole:not([data-copied]) .yes{transition-duration:120ms;transition-timing-function:var(--ease-swift)}
@media(prefers-reduced-motion:reduce){.whole span{transform:none!important;transition:opacity 120ms!important}}
</style>
<h1>Copy answer feedback</h1><p>Both buttons trigger both samples. Repeat clicks during entry, then try the burst. Library uses word mode, 180ms duration, no stagger or bounce. Custom reserves the longer label's space and transitions complete text. Neither writes to the clipboard.</p>
<button id="library" aria-label="Copy answer"><span id="slot" aria-hidden="true"></span></button>
<button id="custom" aria-label="Copy answer"><span class="whole" id="whole" aria-hidden="true"><span class="no">Copy answer</span><span class="yes">Copied answer</span></span></button>
<button id="burst">Burst 10 updates</button><p id="result" role="status">Ready</p>
<script type="module">
const {slotText}=SlotTextPilot;
const el=document.querySelector('#slot'), whole=document.querySelector('#whole');
const reduce=matchMedia('(prefers-reduced-motion:reduce)');
let label, revert, burstTimers=[];
function reset(){label?.destroy();label=undefined;if(reduce.matches)el.textContent='Copy answer';else label=slotText(el,'Copy answer',{rollBy:'word',duration:180,stagger:0,bounce:0,exitOffset:0,easing:'var(--ease-out)'});}
function set(copied){const text=copied?'Copied answer':'Copy answer';if(label)label.set(text);else el.textContent=text;whole.toggleAttribute('data-copied',copied);document.querySelectorAll('#library,#custom').forEach(b=>b.setAttribute('aria-label',text));document.querySelector('#result').textContent=text;}
function flash(){clearTimeout(revert);set(true);revert=setTimeout(()=>set(false),1400);}
reset();reduce.addEventListener('change',()=>{clearTimeout(revert);reset();set(false)});
document.querySelector('#library').onclick=flash;document.querySelector('#custom').onclick=flash;
document.querySelector('#burst').onclick=()=>{clearTimeout(revert);burstTimers.forEach(clearTimeout);burstTimers=Array.from({length:10},(_,i)=>setTimeout(()=>set(i%2===0),i*60));};
window.addEventListener('pagehide',()=>{clearTimeout(revert);burstTimers.forEach(clearTimeout);label?.destroy()},{once:true});
</script>
